<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      padding: 20px;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 16px;
      color: #6b4fbb;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }
    input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    input:focus {
      outline: none;
      border-color: #6b4fbb;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #6b4fbb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #5a3ea8; }
    .status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
    }
    .status.ok { color: #2e7d32; }
    .status.err { color: #d32f2f; }
    .hint {
      margin-top: 16px;
      font-size: 11px;
      color: #888;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>Claude Scraper</h1>

  <label for="api-key">Anthropic API-nøgle</label>
  <input type="password" id="api-key" placeholder="sk-ant-...">

  <button id="save">Gem nøgle</button>
  <div id="status" class="status"></div>

  <div class="hint">
    Din API-nøgle gemmes lokalt i Chrome og sendes kun til Anthropic API.
    Klik CS-knappen nederst til højre på en vilkårlig side for at starte.
  </div>

  <script src="popup.js"></script>
</body>
</html>
